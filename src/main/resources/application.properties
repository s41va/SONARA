spring.application.name=dwese2526-Sonara-api-sdr
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}


# CORREGIDO: Mapeo de CORS apuntando a la variable con guiones bajos
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}


# Indica cual es el fichero de las variables de entorno
spring.config.import=optional:file:.env[.properties]


# Forzado a la inicializacion del datasource con los archivos schema.sql y data.sql
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always


# Define la codificacion de los archivos de propiedades de mensajes.
spring.messages.encoding=UTF-8


# Muestra las consultas SQL generadas en la consola
spring.jpa.show-sql=true


# Formatea las consultas SQL para que sean mas legibles en la consola
spring.jpa.properties.hibernate.format_sql=true


# Dialecto especifico de Hibernate para MariaDB (es compatible con MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect


# Configuracion de los logs del datasource
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG


# Numero maximo de conexiones que puede abrir el pool de conexiones
spring.datasource.hikari.maximum-pool-size=10


# Ruta raiz donde guardaros los ficheros de usuario (fuera del jar)
app.upload-root=${APP_UPLOAD_PATH}


# Spring Boot servir recursos estaticos desde:
spring.web.resources.static-locations=classpath:/static/,file:${app.upload-root}/


spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login


# Base publica REAL (la que ve el usuario en el navegador)
app.public-base-url=${APP_PUBLIC_BASE_URL}
app.frontend.url=${APP_PUBLIC_BASE_URL}


# Ruta del formulario de reset
app.password-reset.path=${APP_PASSWORD_RESET_PATH:/reset-password}


# Fuerza a Spring a leer los archivos de traducción en UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true


# CORREGIDO: Vinculación con las variables del .env
jwt.keystore.path=${JWT_KEYSTORE_PATH}
jwt.keystore.password=${JWT_KEYSTORE_PASSWORD}
jwt.keystore.alias=${JWT_KEYSTORE_ALIAS:jwt-keypair}
jwt.keystore.type=PKCS12


# =========================
# Gmail SMTP (STARTTLS 587)
# =========================
spring.mail.from=${SPRING_MAIL_FROM}
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# CORREGIDO: Nombre de propiedad sin puntos intermedios en la variable
theaudiodb.api.url=${THEAUDIODB_API_URL}


# Configuracion de Google
spring.security.oauth2.client.registration.google.client-id=${OAUTH_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${OAUTH_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile


# Stripe API Key
stripe.key.secret=${STRIPE_API_KEY}